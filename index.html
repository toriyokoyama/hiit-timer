<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>HIIT Timer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ── View: Workout List ──────────────────────────────────────── -->
  <div id="view-list" class="view active">
    <header class="header">
      <h1 class="header-title">HIIT Timer</h1>
      <button class="btn-icon" id="btn-new" title="New workout">＋</button>
    </header>
    <main>
      <ul id="workout-list" class="workout-list"></ul>
      <div id="empty-state" class="empty-state hidden">
        <p>No workouts yet</p>
        <button class="btn-primary" id="btn-new-empty">Create workout</button>
      </div>
    </main>
  </div>

  <!-- ── View: Edit Workout ──────────────────────────────────────── -->
  <div id="view-edit" class="view">
    <header class="header">
      <button class="btn-icon" id="btn-edit-cancel" title="Cancel">✕</button>
      <h1 class="header-title" id="edit-heading">New Workout</h1>
      <button class="btn-icon btn-icon-confirm" id="btn-edit-save" title="Save">✓</button>
    </header>
    <main class="edit-main">
      <div class="form-field">
        <label for="field-name">Name</label>
        <input id="field-name" type="text" placeholder="e.g. Tabata 20/10" autocomplete="off">
      </div>
      <div class="form-field">
        <label for="field-leadin">Lead-in time (seconds, 0 to skip)</label>
        <input id="field-leadin" type="number" min="0" max="60" value="0">
      </div>
      <div class="form-field">
        <label for="field-rounds">Rounds (repeats the looped intervals)</label>
        <input id="field-rounds" type="number" min="1" max="99" value="1">
      </div>
      <div class="section-header">
        <span class="section-label">Intervals</span>
        <button class="btn-secondary" id="btn-add-interval">+ Add interval</button>
      </div>
      <ul id="interval-list" class="interval-list"></ul>
    </main>
  </div>

  <!-- ── View: Start Screen ───────────────────────────────────── -->
  <div id="view-start" class="view">
    <header class="header">
      <button class="btn-icon" id="btn-start-back" title="Back">‹</button>
      <h1 class="header-title" id="start-workout-name"></h1>
      <div style="width:44px"></div>
    </header>
    <main class="start-main">
      <div class="start-stats" id="start-stats"></div>
      <button class="btn-go" id="btn-go">Start</button>
    </main>
  </div>

  <!-- ── View: Timer ────────────────────────────────────────────── -->
  <div id="view-timer" class="view">
    <header class="header">
      <button class="btn-icon" id="btn-timer-stop" title="Stop">✕</button>
      <h1 class="header-title" id="timer-workout-name"></h1>
      <div style="width:44px"></div>
    </header>
    <main class="timer-main">
      <div id="timer-segment-label" class="segment-label"></div>
      <div id="timer-round" class="timer-round"></div>
      <div id="timer-countdown" class="timer-countdown">0:00</div>
      <div class="progress-wrap">
        <div id="timer-progress-bar" class="progress-bar"></div>
      </div>
      <div id="timer-next" class="timer-next"></div>
      <div class="timer-controls">
        <button class="btn-large" id="btn-pause-resume">Pause</button>
      </div>
    </main>
  </div>

  <!-- ── Confirmation Modal ───────────────────────────────────── -->
  <div id="confirm-overlay" class="confirm-overlay hidden" aria-modal="true" role="dialog">
    <div class="confirm-sheet">
      <p id="confirm-message" class="confirm-message"></p>
      <div class="confirm-actions">
        <button class="confirm-btn confirm-cancel" id="confirm-cancel">Cancel</button>
        <button class="confirm-btn confirm-ok" id="confirm-ok">Confirm</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
